# Agropartners API v1 — contrato OpenAPI 3.1
# Generado desde agropartners-api-docs.html. No editar a mano: regenerar desde el visor.

openapi: 3.1.0
info:
  title: Agropartners · API del Portal del Socio
  version: 1.0.0
  summary: Contrato único que consumen la App del Socio, el portal de Administración y Appgronomy.
  description: |
    API pública del ecosistema Agropartners. Las rutas están organizadas por dominio de negocio; la
    extensión `x-agropartners-servicio` que declara cada una es interna y los clientes la ignoran.

    ## Autenticación
    No hay usuario ni contraseña. El socio entra con el celular que registró en Agropartners y un
    código de 4 dígitos que recibe por WhatsApp:

    1. `POST /auth/otp` — recibe el celular y devuelve un `otpId`.
    2. `POST /auth/login` — recibe `otpId` + `codigo`, y devuelve los tokens con el contexto del socio.

    Esos dos, junto con `POST /auth/refresh` y `GET /version`, son los **únicos endpoints públicos**.
    Todos los demás exigen `Authorization: Bearer <token>`.

    **No hay roles ni ámbitos.** Todo usuario habilitado puede invocar todas las operaciones; lo único
    que varía entre dos usuarios es sobre qué socios.

    ## Control de versión de la App
    `GET /version` es lo primero que la App invoca al arrancar, antes del login. Decide por
    `permiteContinuar`, no por `estado`, y si la llamada falla la App continúa igual.

    ## Alcance por socio
    El token determina los socios visibles. Omitir `cardCode` equivale al filtro «Todos» y agrega los
    socios autorizados. Un `cardCode` no autorizado responde `403`.

    ## Envelope de respuesta
    Toda respuesta viaja como `{ data, success, error }`. Con `success: true`, `error` es null; con
    `success: false`, `data` es null y `error` trae el detalle. El código de estado HTTP conserva su
    semántica real (401, 404, 409…).

    ## Latencia de sincronización
    Los datos vienen de SAP Business One y tardan hasta 60 segundos en verse aquí. Un documento recién
    emitido puede responder `404`; conviene reintentar antes de tratarlo como inexistente.

    ## Escrituras asincrónicas
    Solicitar una visita técnica o un estado de cuenta responde `202 Accepted` con un identificador de
    seguimiento. El avance del estado de cuenta se consulta con `GET /estados-de-cuenta`; la solicitud
    de visita no tiene seguimiento.

    ## Paginación
    Paginan seis colecciones: `/productos`, `/campanas/{campanaId}/compras`, `/facturas`,
    `/movimientos`, `/reportes-campo` y `/avisos`. Aceptan `pagina` y `tamanoPagina`, y devuelven el
    bloque `paginacion` dentro de `data`. Las demás devuelven la lista completa.

    ## Moneda y formato
    **Toda la API opera en dólares (USD).** No hay parámetro de moneda ni tipo de cambio.

    Importes, cantidades y porcentajes viajan **ya formateados**, como string: `Importe` trae
    `$us 2.065,80`, `cantidadFormateada` trae `50.000 Kg/L` y `Porcentaje` trae `58%`. Los conteos
    viajan como enteros. Las fechas usan `date` (`2025-10-07`) y los instantes `date-time` en UTC.

    ## Aviso legal obligatorio
    Toda vista de saldos debe reproducir sin modificación el texto devuelto en `avisoLegal`.
