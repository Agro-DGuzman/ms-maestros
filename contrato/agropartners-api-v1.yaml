components:
  securitySchemes:
    tokenPortador:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        JWT obtenido en `POST /auth/login`. Se envía en `Authorization: Bearer <token>`.

        **No hay roles ni ámbitos.** La autorización se resuelve con un solo control: qué socios ve el
        token. Todo usuario habilitado puede invocar todas las operaciones; lo que cambia entre dos
        usuarios es el conjunto de socios sobre el que puede hacerlo.

        Un `cardCode` fuera del alcance del token responde `403` con `code: [ACCESO_DENEGADO]`.
  parameters:
    CardCodePath:
      name: cardCode
      in: path
      required: true
      description: Código de interlocutor comercial en SAP (`OCRD.CardCode`).
      schema:
        $ref: '#/components/schemas/CardCode'
    CardCodeQuery:
      name: cardCode
      in: query
      description: |
        Socio a consultar. Omitir equivale al filtro «Todos» y agrega los socios autorizados
        por el token.
      schema:
        $ref: '#/components/schemas/CardCode'
    CampanaId:
      name: campanaId
      in: path
      required: true
      description: Identificador de campaña agrícola.
      schema:
        type: string
        examples:
        - v2526
    ItemCode:
      name: itemCode
      in: path
      required: true
      description: Código de artículo SAP (`OITM.ItemCode`).
      schema:
        type: string
        examples:
        - A-0142
    DocEntry:
      name: docEntry
      in: path
      required: true
      description: Clave interna del documento en SAP (`OINV.DocEntry`).
      schema:
        type: integer
        examples:
        - 1877
    MovimientoId:
      name: movimientoId
      in: path
      required: true
      schema:
        type: string
        examples:
        - MOV-000000318
      description: Identificador del movimiento.
    ReporteId:
      name: reporteId
      in: path
      required: true
      description: Referencia del informe de visita.
      schema:
        type: string
        examples:
        - RV-2025-0146
    Buscar:
      name: buscar
      in: query
      description: |-
        Búsqueda por texto. **Solo la acepta `GET /campanas/{campanaId}/compras`**, que alimenta el
        buscador de la pantalla *Productos de campaña*.
      schema:
        type: string
        maxLength: 80
        examples:
        - gliforte
    Pagina:
      name: pagina
      in: query
      description: Número de página, base 1. Solo en las seis colecciones que paginan; ver `Paginacion`.
      schema:
        type: integer
        minimum: 1
        default: 1
    TamanoPagina:
      name: tamanoPagina
      in: query
      description: Elementos por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |-
        UUID v4 generado por el cliente. Obligatorio. Repetir la clave dentro de 24 h devuelve la respuesta
        original sin volver a ejecutar la operación.
      schema:
        type: string
        format: uuid
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |-
        Validador recibido en el `ETag` de una respuesta anterior. Si el contenido no cambió, la
        operación responde `304` sin cuerpo y el cliente reutiliza lo que tiene guardado.
      schema:
        type: string
      examples:
        validador:
          value: '"a3f9c1e07b"'
  responses:
    NoAutenticado:
      description: Token ausente, expirado o inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            tokenExpirado:
              value:
                data: null
                success: false
                error:
                  code:
                  - TOKEN_INVALIDO
                  description: El token de acceso expiró. Solicita uno nuevo con el refresh token.
                  structuredMessage: []
                  type: FAILURE
    Prohibido:
      description: Autenticado, pero sin visibilidad sobre el socio consultado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            fueraDeAlcance:
              summary: El token no alcanza al socio consultado
              value:
                data: null
                success: false
                error:
                  code:
                  - ACCESO_DENEGADO
                  description: No tenés visibilidad sobre el socio consultado.
                  structuredMessage: []
                  type: FAILURE
    EntidadNoProcesable:
      description: La solicitud es válida pero viola una regla de negocio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespuestaError'
          examples:
            propiedadAjena:
              value:
                data: null
                success: false
                error:
                  code:
                  - REGLA_NEGOCIO_VIOLADA
                  description: La propiedad PROP-031 no pertenece al socio C-004871.
                  structuredMessage: []
                  type: VALIDATION
  schemas:
    CardCode:
      type: string
      pattern: ^C-[0-9]{6}$
      description: Código de interlocutor comercial en SAP Business One.
      examples:
      - C-004871
    CodigoCategoria:
      type: string
      enum:
      - herbicidas
      - semillas
      - fertilizantes
      - insecticidas
      description: Categoría comercial derivada del grupo de artículos SAP (`OITB`).
    Importe:
      type: string
      description: 'Importe ya formateado: separador de miles `.`, dos decimales tras `,` y el marcador
        de moneda al frente. Siempre positivo; la dirección la expresa `signo`. Toda la API opera en dólares
        (USD).'
      examples:
      - $us 2.065,80
    AvisoLegal:
      type: string
      description: Texto que la interfaz muestra sin modificación junto a los saldos.
      examples:
      - Esta información es referencial y está sujeta a verificación de Agropartners, por lo que carece
        de valor legal.
    TipoMovimiento:
      type: string
      enum:
      - compra_credito
      - pago_recibido
      description: |-
        Los dos hechos que mueven el saldo:

        - `compra_credito` — insumos facturados sin pago inmediato. Aumenta la deuda. (`OINV`)
        - `pago_recibido` — depósito del socio en una cuenta de recaudación. La baja. (`ORCT`)

        El interés devengado, las notas de crédito y los ajustes no se publican como movimientos.
    SocioReferencia:
      type: object
      required:
      - cardCode
      - razonSocial
      description: Referencia liviana a un socio, sin datos fiscales.
      properties:
        cardCode:
          $ref: '#/components/schemas/CardCode'
        razonSocial:
          type: string
          examples:
          - Monasterio Hermanos S.R.L.
        grupo:
          allOf:
          - $ref: '#/components/schemas/GrupoReferencia'
    DatosFiscales:
      type: object
      description: Identificación fiscal completa, para cabeceras de documentos tributarios.
      required:
      - razonSocial
      - nit
      properties:
        cardCode:
          $ref: '#/components/schemas/CardCode'
        razonSocial:
          type: string
        nit:
          type: string
    RegistroDispositivo:
      type: object
      required:
      - instalacionId
      - plataforma
      properties:
        instalacionId:
          type: string
          format: uuid
        plataforma:
          type: string
          enum:
          - android
          - ios
      description: La instalación desde la que se inició sesión. Se envía solo en `POST /auth/login`.
    Socio:
      type: object
      required:
      - cardCode
      - razonSocial
      description: 'El productor agropecuario que compra insumos: iniciales, razón social y cantidad de
        propiedades.'
      properties:
        cardCode:
          $ref: '#/components/schemas/CardCode'
        razonSocial:
          type: string
          examples:
          - Sebastian Monasterio
        iniciales:
          type: string
          maxLength: 2
        cantidadPropiedades:
          type: integer
          minimum: 0
          description: Conteo de elementos.
    Propiedad:
      type: object
      required:
      - id
      - nombre
      description: Una propiedad del socio. Se listan en el paso 2 de *Solicitar visita técnica* y se
        envían por `id` en `POST /solicitudes-visita`.
      properties:
        id:
          type: string
          description: Identificador de la propiedad. Es lo que viaja en `propiedades[]` al solicitar
            una visita.
          examples:
          - PROP-014
        nombre:
          type: string
          description: Nombre de la propiedad tal como se muestra en la lista de selección.
          examples:
          - Lote 14 · San Julián
    Categoria:
      type: object
      required:
      - codigo
      - nombre
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoCategoria'
        nombre:
          type: string
          examples:
          - Herbicidas
      description: Categoría del catálogo. Es lo que muestra el chip y con lo que se filtra `GET /productos`.
    ProductoResumen:
      type: object
      required:
      - itemCode
      - nombre
      - categoria
      properties:
        itemCode:
          type: string
          examples:
          - A-0142
        nombre:
          type: string
          examples:
          - Gliforte 68 SG
        categoria:
          $ref: '#/components/schemas/Categoria'
        presentacion:
          type: string
          examples:
          - Bolsa 10 Kg
        imagenUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Foto en Azure Blob Storage, servida por CDN. Null cuando el artículo no tiene imagen;
            la App dibuja el ícono de la categoría.
          examples:
          - https://cdn.agropartners.com.bo/productos/A-0142.webp
      description: 'El artículo tal como lo pinta la tarjeta del catálogo: foto, categoría, nombre y presentación.'
    ProductoDetalle:
      allOf:
      - $ref: '#/components/schemas/ProductoResumen'
      - type: object
        properties:
          descripcion:
            type: string
          ingredienteActivo:
            type:
            - string
            - 'null'
            description: Ingrediente activo en un agroquímico, especie e híbrido en una semilla, composición
              de nutrientes en un fertilizante. La pantalla lo etiqueta «Ingrediente activo».
            examples:
            - Glifosato sal de amonio 68%
          formulacion:
            type:
            - string
            - 'null'
            examples:
            - Gránulos solubles (SG)
          dosisReferencial:
            type:
            - string
            - 'null'
            examples:
            - 1,5 – 3,0 Kg/ha
          cultivos:
            type: array
            items:
              type: string
            description: Cultivos en los que se emplea.
            examples:
            - - Barbecho químico
          registro:
            oneOf:
            - $ref: '#/components/schemas/RegistroDelProducto'
            - type: 'null'
        required: []
      description: 'El producto completo: lo de la tarjeta más descripción, ingrediente activo, formulación,
        dosis, cultivos y datos de registro.'
    DocumentoDescargable:
      type: object
      required:
      - tipo
      - nombre
      - url
      properties:
        tipo:
          type: string
          enum:
          - ficha_tecnica
          - hoja_seguridad
          - registro_sanitario
        nombre:
          type: string
        url:
          type: string
          format: uri
          description: URL con firma SAS de Azure Blob Storage, válida 60 minutos.
      description: Ficha técnica u hoja de seguridad del producto, con su enlace de descarga.
    Campana:
      type: object
      description: Campaña agrícola.
      required:
      - id
      - nombre
      - montoComprado
      properties:
        id:
          type: string
          examples:
          - v2526
        nombre:
          type: string
          examples:
          - Verano 2526
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        montoComprado:
          $ref: '#/components/schemas/Importe'
        cantidadFacturas:
          type: integer
          minimum: 0
          description: Conteo de elementos.
    CompraPorProducto:
      type: object
      description: 'Lo comprado de un artículo dentro de una campaña. Origen: `INV1` agrupado por `ItemCode`.'
      required:
      - itemCode
      - nombre
      - monto
      properties:
        itemCode:
          type: string
          examples:
          - A-0142
        nombre:
          type: string
          examples:
          - Gliforte 68 SG
        cantidadFormateada:
          type: string
          description: Cantidad y unidad en un solo string, en formato es-BO.
          examples:
          - 50.000 Kg/L
        monto:
          $ref: '#/components/schemas/Importe'
        participacion:
          allOf:
          - $ref: '#/components/schemas/Porcentaje'
          description: Cuánto pesa este producto sobre el total comprado en la campaña. La pantalla lo
            imprime seguido de «del total».
        icono:
          type: string
          examples:
          - science
    CompraPorProductoDetalle:
      allOf:
      - $ref: '#/components/schemas/CompraPorProducto'
      - type: object
        properties:
          campanaId:
            type: string
          campanaNombre:
            type: string
          facturas:
            type: array
            items:
              $ref: '#/components/schemas/FacturaResumen'
            description: Facturas en las que aparece el artículo dentro de la campaña, de la más reciente
              a la más antigua. La cabecera muestra su cantidad.
    FacturaResumen:
      type: object
      description: 'Factura de venta emitida al socio. Origen SAP: `OINV`. Las facturas anuladas no se
        devuelven.'
      required:
      - docEntry
      - numero
      - fecha
      - total
      properties:
        docEntry:
          type: integer
          examples:
          - 1877
        numero:
          type: string
          examples:
          - '1877'
        fecha:
          type: string
          format: date
          examples:
          - '2025-10-07'
        cantidadLineas:
          type: integer
          minimum: 0
          description: Conteo de elementos.
        campanaId:
          type: string
        total:
          $ref: '#/components/schemas/Importe'
    FacturaDetalle:
      allOf:
      - $ref: '#/components/schemas/FacturaResumen'
      - type: object
        description: El total del documento es `total`, heredado de `FacturaResumen`. `descuento` es la
          única fila que lo acompaña en el bloque de importes.
        required:
        - emisor
        - receptor
        - lineas
        properties:
          emisor:
            $ref: '#/components/schemas/DatosFiscales'
          receptor:
            $ref: '#/components/schemas/DatosFiscales'
          campanaNombre:
            type: string
          codigoAutorizacion:
            type: string
            description: Código de autorización de facturación electrónica.
            examples:
            - 455F56CE…1F74
          lineas:
            type: array
            description: 'Origen SAP: `INV1`.'
            items:
              $ref: '#/components/schemas/LineaFactura'
          descuento:
            $ref: '#/components/schemas/Importe'
    LineaFactura:
      type: object
      required:
      - itemCode
      - descripcion
      - importe
      properties:
        itemCode:
          type: string
        descripcion:
          type: string
          examples:
          - Sorgo Jisunú 101
        cantidadFormateada:
          type: string
          description: 'Cantidad y unidad en un solo texto: «Sorgo Jisunú 101 · 50 bolsas».'
          examples:
          - 50 bolsas
        importe:
          $ref: '#/components/schemas/Importe'
    Resumen:
      type: object
      description: 'Vista compuesta de *Inicio*: línea de crédito, deuda, últimos movimientos y avisos
        sin leer.'
      required:
      - lineaCredito
      - deuda
      properties:
        lineaCredito:
          type: object
          required:
          - aprobada
          - disponible
          - porcentajeUtilizado
          properties:
            disponible:
              $ref: '#/components/schemas/Importe'
            porcentajeUtilizado:
              $ref: '#/components/schemas/Porcentaje'
            aprobada:
              $ref: '#/components/schemas/Importe'
          description: '`disponible = aprobada − utilizada`.'
        deuda:
          type: object
          required:
          - total
          properties:
            total:
              $ref: '#/components/schemas/Importe'
          description: Lo que la tarjeta de Inicio rotula «Por pagar». El desglose en capital e interés
            lo devuelve `GET /cuentas-por-pagar`.
        movimientosRecientes:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/Movimiento'
        avisosSinLeer:
          type: integer
          minimum: 0
          description: Avisos sin leer, para el punto sobre la campana del encabezado.
    CuentasPorPagar:
      type: object
      description: Vista compuesta de la pantalla *Cuentas por pagar*.
      required:
      - saldoTotal
      - capital
      - interes
      - campanas
      - avisoLegal
      properties:
        saldoTotal:
          $ref: '#/components/schemas/Importe'
        capital:
          $ref: '#/components/schemas/Importe'
        interes:
          $ref: '#/components/schemas/Importe'
        campanas:
          type: array
          items:
            type: object
            required:
            - campanaId
            - nombre
            - deuda
            properties:
              campanaId:
                type: string
              nombre:
                type: string
              deuda:
                $ref: '#/components/schemas/Importe'
              cantidadFacturas:
                type: integer
                minimum: 0
              desde:
                type: string
                format: date
              hasta:
                type: string
                format: date
        avisoLegal:
          $ref: '#/components/schemas/AvisoLegal'
        calculadoEn:
          type: string
          format: date-time
    DeudaCampana:
      type: object
      required:
      - campanaId
      - nombre
      - deuda
      properties:
        campanaId:
          type: string
        nombre:
          type: string
        deuda:
          $ref: '#/components/schemas/Importe'
        cantidadFacturas:
          type: integer
          minimum: 0
          description: Conteo de elementos.
        desde:
          type: string
          format: date
        hasta:
          type: string
          format: date
        cantidadMovimientos:
          type: integer
          minimum: 0
          description: Conteo de elementos.
    SolicitudEstadoDeCuenta:
      type: object
      properties:
        cardCode:
          $ref: '#/components/schemas/CardCode'
      description: De qué socio se emite el estado de cuenta.
      required:
      - cardCode
    EstadoDeCuenta:
      type: object
      required:
      - socio
      - estado
      description: 'El último estado de cuenta emitido para un socio; cada emisión reemplaza a la anterior.
        Se emite por socio de negocio: la lista trae una entrada por cada socio que la persona alcanza.'
      properties:
        socio:
          allOf:
          - $ref: '#/components/schemas/SocioDelContacto'
          description: De quién es el documento. La fila muestra sus iniciales y su razón social.
        estado:
          type: string
          enum:
          - sin_emitir
          - pendiente
          - generando
          - disponible
          - fallida
          description: |-
            En qué punto está el documento de este socio:

            - `sin_emitir` — nunca se generó uno; el botón queda deshabilitado.
            - `pendiente` / `generando` — hay una emisión en curso.
            - `disponible` — `url` sirve para bajarlo.
            - `fallida` — puede volver a pedirse.
        url:
          type:
          - string
          - 'null'
          format: uri
          description: URL firmada, presente solo cuando el estado es `disponible`. Firma SAS de 60 minutos.
        expiraEn:
          type:
          - string
          - 'null'
          format: date-time
          description: Caducidad de la firma SAS de `url`; null mientras el estado no sea `disponible`.
        emitidoEl:
          type:
          - string
          - 'null'
          format: date-time
          description: Cuándo se emitió el documento vigente; null si nunca se emitió uno.
        tamanoFormateado:
          type:
          - string
          - 'null'
          description: Peso del PDF ya redondeado, tal como se muestra. Null mientras no haya documento.
          examples:
          - 240 KB
        solicitudId:
          type:
          - string
          - 'null'
          format: uuid
          description: Emisión que produjo —o está produciendo— este documento. Null si nunca se pidió
            una.
    Movimiento:
      type: object
      required:
      - id
      - tipo
      - concepto
      - fecha
      - monto
      - capital
      - interes
      - signo
      properties:
        id:
          type: string
          examples:
          - MOV-000001877
        tipo:
          $ref: '#/components/schemas/TipoMovimiento'
        fecha:
          type: string
          format: date
        monto:
          $ref: '#/components/schemas/Importe'
        capital:
          oneOf:
          - $ref: '#/components/schemas/Importe'
          - type: 'null'
          description: Principal de la compra. Null en un `pago_recibido`.
        interes:
          oneOf:
          - $ref: '#/components/schemas/Importe'
          - type: 'null'
          description: Interés del crédito, devengado al facturar. Null en un `pago_recibido`; `0,00`
            en una compra sin interés.
        signo:
          type: string
          enum:
          - cargo
          - abono
          description: '`cargo` incrementa la deuda; `abono` la reduce. El importe siempre viaja en valor
            absoluto.'
        concepto:
          type: string
          examples:
          - Compra a crédito
          description: Rótulo del movimiento en pantalla. Lo usan la fila de la lista y el encabezado
            del comprobante.
      description: |-
        Una compra o un pago. La compra viene desglosada y vale `monto = capital + interes`; el pago no se desglosa y ambos campos llegan en null.

        Solo se publican movimientos confirmados en SAP.
    MovimientoDetalle:
      allOf:
      - $ref: '#/components/schemas/Movimiento'
      - type: object
        properties:
          hora:
            type: string
            pattern: ^[0-9]{2}:[0-9]{2}$
            examples:
            - 09:05
            description: Hora del asiento en SAP, en zona horaria de Bolivia. El comprobante la imprime
              junto a la fecha; las filas de la lista muestran el día.
          medio:
            type: string
            examples:
            - Transferencia · Banco Nacional de Bolivia 1000...6033
          campanaId:
            type: string
          campanaNombre:
            type: string
          socio:
            $ref: '#/components/schemas/SocioReferencia'
          documentoDeOrigen:
            type: string
            examples:
            - Recibo N° 4512
          facturaDeOrigen:
            type:
            - integer
            - 'null'
            description: Factura de la que nace el movimiento. Solo la compra a crédito la tiene.
        description: |-
          El comprobante de un movimiento: lo mismo que la fila de la lista, más la hora y de dónde salió.
          El rótulo del encabezado es `concepto`, el mismo que muestra la fila.
        required:
        - hora
      description: 'El comprobante de un movimiento: lo de la fila más la hora y de dónde salió.'
    ReporteCampoResumen:
      type: object
      required:
      - id
      - propiedadId
      - propiedad
      - fecha
      properties:
        id:
          type: string
          examples:
          - RV-2025-0146
        propiedadId:
          type: string
          examples:
          - PROP-014
        propiedad:
          type: string
          description: Nombre de la propiedad visitada. Es el mismo texto que `Propiedad.nombre`.
          examples:
          - Lote 14 · San Julián
        fecha:
          type: string
          format: date
        tecnico:
          type: string
          examples:
          - Ing. Agr. M. Áñez
        observacion:
          type: string
          description: Observación breve mostrada en la lista.
      description: 'Una visita realizada: propiedad, fecha, técnico y la observación breve del técnico.'
    ReporteCampoDetalle:
      allOf:
      - $ref: '#/components/schemas/ReporteCampoResumen'
      - type: object
        properties:
          hora:
            type: string
            pattern: ^[0-9]{2}:[0-9]{2}$
            examples:
            - '10:15'
            description: Hora de la visita. El encabezado del informe la imprime junto a la fecha; las
              filas de la lista muestran el día.
          socio:
            type: string
            description: Razón social del socio dueño de la propiedad.
            examples:
            - Sebastian Monasterio
          zona:
            oneOf:
            - $ref: '#/components/schemas/ZonaComercial'
            - type: 'null'
            description: Zona comercial de la propiedad. Null si todavía no tiene zona asignada; la App
              omite la fila.
          cultivo:
            type:
            - string
            - 'null'
            description: Especie y variedad sembradas, tal como se muestran. Null si estaba en barbecho.
            examples:
            - Soya · Munasqa RR
          contacto:
            type:
            - string
            - 'null'
            description: La persona de contacto registrada en el socio.
            examples:
            - Mónica Salvatierra
          problema:
            type:
            - string
            - 'null'
            description: Lo que el técnico encontró. La pantalla lo titula «Problema». Null cuando no
              hay nada que reportar; la App omite la sección.
            examples:
            - Focos de chinche marrón en el borde norte del lote, por debajo del umbral de daño económico.
          sugerencia:
            type:
            - string
            - 'null'
            description: Qué recomienda hacer el técnico. La pantalla lo titula «Sugerencia». Null si
              no hay ninguna.
            examples:
            - Mantener el monitoreo semanal y aplicar fungicida preventivo si la humedad relativa supera
              el 80%.
          fotografias:
            type: array
            description: Fotos de la visita, en el orden en que deben mostrarse.
            items:
              $ref: '#/components/schemas/FotografiaDelLote'
        description: |-
          Todo lo que la pantalla *Informe de visita* muestra.

          **«Datos de la propiedad» son cuatro campos con nombre** —`socio`, `zona`, `cultivo`,
          `contacto`—. Tres llegan como texto listo para imprimir; `zona` viaja como código.
        required:
        - hora
      description: 'El informe de visita completo: encabezado, datos de la propiedad, problema, sugerencia
        y fotografías.'
    NuevaSolicitudVisita:
      type: object
      required:
      - cardCode
      - propiedades
      properties:
        cardCode:
          $ref: '#/components/schemas/CardCode'
        propiedades:
          type: array
          minItems: 1
          maxItems: 20
          description: Identificadores de propiedades del socio indicado.
          items:
            type: string
            examples:
            - PROP-014
      description: El socio y las propiedades que se quieren visitar.
    TitularCuentas:
      type: object
      required:
      - razonSocial
      - nit
      properties:
        razonSocial:
          type: string
          examples:
          - Agropartners S.R.L.
        nit:
          type: string
          examples:
          - '1013879029'
    CuentaBancaria:
      type: object
      required:
      - banco
      - numeroCuenta
      properties:
        banco:
          type: string
          examples:
          - Banco Nacional de Bolivia
        numeroCuenta:
          type: string
          examples:
          - '10000006816033'
    Paginacion:
      type: object
      required:
      - pagina
      - tamanoPagina
      - total
      - totalPaginas
      properties:
        pagina:
          type: integer
          minimum: 1
          examples:
          - 1
        tamanoPagina:
          type: integer
          examples:
          - 20
        total:
          type: integer
          description: Total de elementos que satisfacen el filtro.
        totalPaginas:
          type: integer
      description: 'Metadatos de paginación, dentro de `data`. Paginan seis colecciones: `/productos`,
        `/campanas/{campanaId}/compras`, `/facturas`, `/movimientos`, `/reportes-campo` y `/avisos`. Las
        demás devuelven la lista completa.'
    RespuestaError:
      type: object
      description: Envelope de error. `success` es siempre false y `data` siempre null. El código de estado
        HTTP conserva su semántica real.
      required:
      - data
      - success
      - error
      properties:
        data:
          type: 'null'
          description: Siempre null cuando `success` es false.
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorApi'
    ErrorApi:
      type: object
      required:
      - code
      - type
      properties:
        code:
          type: array
          description: 'Códigos de error en `SCREAMING_SNAKE_CASE`. Es una lista: una respuesta de validación
            puede reportar varios a la vez.'
          items:
            type: string
          examples:
          - - CAMPO_REQUERIDO
            - RANGO_INVALIDO
        description:
          type: string
          description: Mensaje en español, apto para mostrar al usuario cuando no hay detalle por campo.
        structuredMessage:
          type: array
          description: Desglose campo por campo. Vacío en errores que no son de validación.
          items:
            $ref: '#/components/schemas/DetalleCampo'
        type:
          type: string
          enum:
          - FAILURE
          - VALIDATION
          - PROBLEM
          - NOT_FOUND
          - CONFLICT
          description: |-
            Familia del error. Determina el tratamiento del cliente:

            - `VALIDATION` (400, 422): corregible por el usuario. Resaltar campos.
            - `NOT_FOUND` (404): reintentable.
            - `CONFLICT` (409): no reintentar.
            - `FAILURE` (401, 403, 429): autenticación, permisos o límite de tasa.
            - `PROBLEM` (500, 503): reintentar con retroceso exponencial.
    DetalleCampo:
      type: object
      required:
      - campo
      - mensaje
      properties:
        campo:
          type: string
          description: Ruta del campo, con puntos para anidamiento.
          examples:
          - propiedades[0]
        codigo:
          type: string
          examples:
          - CAMPO_REQUERIDO
        mensaje:
          type: string
          examples:
          - Debe ser posterior o igual a «desde».
    EnlaceDescarga:
      type: object
      required:
      - url
      description: Enlace a un documento en Azure Blob Storage. La `url` lleva firma SAS de 60 minutos;
        vencida, la descarga responde `403`.
      properties:
        url:
          type: string
          format: uri
    SesionAplicacion:
      type: object
      required:
      - sesionId
      - tokens
      - contexto
      - iniciadaEn
      - expiraEn
      properties:
        sesionId:
          type: string
          format: uuid
          description: Identificador de la sesión, para correlacionar la actividad en Azure Monitor y
            en la traza de auditoría.
        tokens:
          allOf:
          - $ref: '#/components/schemas/TokensAcceso'
        contexto:
          $ref: '#/components/schemas/PersonaDeContacto'
        iniciadaEn:
          type: string
          format: date-time
        expiraEn:
          type: string
          format: date-time
          description: Caducidad de la sesión de aplicación, distinta de la del token de Entra.
        dispositivoRegistrado:
          type: boolean
          description: False si no se envió el bloque `dispositivo` o si el registro push fue rechazado.
    CierreSesion:
      type: object
      properties:
        refreshToken:
          type: string
          description: Token a revocar.
        instalacionId:
          type: string
          format: uuid
          description: Instalación cuyo registro push se dará de baja. Omitir si nunca se registró.
    CierreSesionResultado:
      type: object
      required:
      - sesionCerrada
      properties:
        sesionCerrada:
          type: boolean
          description: False cuando no había sesión abierta. La operación se considera exitosa igualmente.
      description: Resultado del cierre.
    TokensAcceso:
      type: object
      required:
      - accessToken
      - tokenType
      - expiraEnSegundos
      - refreshToken
      description: Tokens emitidos por Entra External ID y retransmitidos por el backend.
      properties:
        accessToken:
          type: string
          description: 'JWT que la App envía en `Authorization: Bearer`.'
        tokenType:
          type: string
          const: Bearer
        expiraEnSegundos:
          type: integer
          description: Vigencia del access token.
          examples:
          - 3600
        refreshToken:
          type: string
          description: Se guarda en el almacenamiento seguro del dispositivo (Keychain / Keystore). Rota
            en cada renovación. Mientras siga vivo, la App pide huella o rostro en lugar del código.
    RenovacionSesion:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    EstadoVersion:
      type: object
      required:
      - estado
      - versionConsultada
      - permiteContinuar
      description: |-
        Qué hacer con la versión que el socio tiene instalada.

        **Es un interruptor de emergencia**, y por eso el texto viaja desde el servidor en vez de estar en
        el binario: permite retirar una versión con un fallo, explicar por qué y mandar a la tienda, sin
        publicar un build nuevo.
      properties:
        estado:
          type: string
          enum:
          - vigente
          - actualizacion_sugerida
          - actualizacion_obligatoria
          description: Informativo, para telemetría y para el texto de la interfaz. **La decisión de
            bloquear la toma `permiteContinuar`**, que es estable aunque este enumerado crezca.
        versionConsultada:
          type: string
          description: Eco de la versión recibida.
          examples:
          - 2.0.0
        versionMinimaSoportada:
          type: string
          description: Por debajo de esta versión, `permiteContinuar` es false.
          examples:
          - 1.8.0
        versionRecomendada:
          type: string
          description: Última publicada en la tienda para esta plataforma.
          examples:
          - 2.1.0
        permiteContinuar:
          type: boolean
          description: False bloquea la App hasta que el socio actualice.
        titulo:
          type:
          - string
          - 'null'
          description: Encabezado del aviso. Null cuando no hay nada que avisar.
        mensaje:
          type:
          - string
          - 'null'
          description: Por qué se pide actualizar, en palabras del socio.
        urlTienda:
          type:
          - string
          - 'null'
          format: uri
          description: 'A dónde manda el botón: Play Store o App Store según la plataforma consultada.'
        consultadoEn:
          type: string
          format: date-time
    GrupoReferencia:
      type: object
      required:
      - id
      - nombre
      properties:
        id:
          type: string
          examples:
          - GRP-014
        nombre:
          type: string
          examples:
          - Grupo Monasterio
    PersonaDeContacto:
      type: object
      required:
      - nombre
      - grupoEconomico
      description: 'La persona física registrada dentro de un socio. Es el contexto de la sesión: sus
        datos y el grupo económico con los socios que alcanza.'
      properties:
        nombre:
          type: string
          examples:
          - Mónica Salvatierra
        iniciales:
          type: string
          maxLength: 2
          examples:
          - MS
        celular:
          type:
          - string
          - 'null'
          description: El celular con el que la persona entra al portal. Se muestra en *Mi perfil*.
          examples:
          - +591 707 41 828
        grupoEconomico:
          $ref: '#/components/schemas/GrupoEconomico'
    Aviso:
      type: object
      required:
      - id
      - grupo
      - categoria
      - titulo
      - cuerpo
      - creadoEn
      - leida
      properties:
        id:
          type: string
          examples:
          - NOT-0001
        grupo:
          type: string
          enum:
          - hoy
          - esta_semana
          - anteriores
          description: Agrupación calculada en zona horaria America/La_Paz.
        categoria:
          type: string
          enum:
          - factura
          - vencimiento
          - pago
          - reporte_campo
          - catalogo
          description: De qué habla el aviso. Cada valor cae bajo un interruptor de *Preferencias de avisos*.
        titulo:
          type: string
        cuerpo:
          type: string
        creadoEn:
          type: string
          format: date-time
        leida:
          type: boolean
      description: El mensaje que el portal muestra o empuja al celular del usuario.
    ContactoDeAtencion:
      type: object
      required:
      - area
      - telefono
      - whatsappUrl
      description: 'El canal de atención al que la App manda al socio: Control de Calidad, por WhatsApp.'
      properties:
        area:
          type: string
          examples:
          - Atención al Cliente
          description: Cómo se rotula la fila en el menú.
        telefono:
          type: string
          examples:
          - +591 67701468
        whatsappUrl:
          type: string
          format: uri
          description: Enlace `wa.me` ya armado que la App abre al tocar la fila.
    PreferenciasDeAvisos:
      type: object
      required:
      - categorias
      description: Las categorías de aviso que el socio quiere recibir. Los cuatro interruptores cubren
        las cinco categorías de `Aviso`.
      properties:
        categorias:
          type: object
          description: Cada clave gobierna las categorías de `Aviso` que se indican.
          required:
          - facturas
          - pagos
          - reportes
          - catalogo
          properties:
            facturas:
              type: boolean
              description: Cubre `factura` y `vencimiento`.
            pagos:
              type: boolean
              description: Cubre `pago`.
            reportes:
              type: boolean
              description: Cubre `reporte_campo`.
            catalogo:
              type: boolean
              description: Cubre `catalogo`.
    ActualizarPreferenciasDeAvisos:
      type: object
      minProperties: 1
      description: 'Actualización parcial: se envían solo las claves que cambian.'
      properties:
        categorias:
          type: object
          properties:
            facturas:
              type: boolean
            pagos:
              type: boolean
            reportes:
              type: boolean
            catalogo:
              type: boolean
    RegistroDelProducto:
      type: object
      required:
      - entidad
      - numero
      description: Registro ante SENASAG o INIAF. Son las filas de «Datos de registro» de la ficha.
      properties:
        entidad:
          type: string
          enum:
          - SENASAG
          - INIAF
          - otro
          examples:
          - SENASAG
        numero:
          type: string
          examples:
          - 1842-H
    SolicitudCodigo:
      type: object
      required:
      - telefono
      description: Petición del código de acceso.
      properties:
        telefono:
          type: string
          description: Número local, sin prefijo de país. El servicio antepone `+591` y normaliza el celular
            registrado en SAP antes de comparar. Debe ser el de un usuario habilitado.
          examples:
          - '70741828'
        canal:
          type: string
          enum:
          - whatsapp
          default: whatsapp
          description: Canal de entrega. Hoy solo WhatsApp.
    DesafioOtp:
      type: object
      required:
      - otpId
      description: 'El desafío abierto. No es una credencial: sin el código que llegó al WhatsApp del
        socio, el `otpId` no abre nada.'
      properties:
        otpId:
          type: string
          format: uuid
          description: Identifica este desafío en `POST /auth/login`. Se consume al primer código correcto.
          examples:
          - e2b5a4d1-0c67-4f3a-9b18-5d2c7e91f306
    CodigoDeAcceso:
      type: object
      required:
      - otpId
      - codigo
      description: El código recibido por WhatsApp y el desafío al que responde. Viaja solo sobre TLS
        y nunca se registra en logs ni trazas.
      properties:
        otpId:
          type: string
          format: uuid
          description: El devuelto por `POST /auth/otp`.
          examples:
          - e2b5a4d1-0c67-4f3a-9b18-5d2c7e91f306
        codigo:
          type: string
          pattern: ^\d{4}$
          minLength: 4
          maxLength: 4
          description: 'Los 4 dígitos recibidos. Se envía como cadena: `0421` es un código válido.'
          examples:
          - '0421'
        dispositivo:
          allOf:
          - $ref: '#/components/schemas/RegistroDispositivo'
          description: Omitir si el usuario no concedió permiso de notificaciones.
    FotografiaDelLote:
      type: object
      required:
      - id
      - url
      - expiraEn
      description: Una foto tomada durante la visita, servida desde Azure Blob Storage con firma SAS.
      properties:
        id:
          type: string
          examples:
          - RV-2025-0146-F02
        url:
          type: string
          format: uri
          description: Imagen a resolución completa, con firma SAS válida 60 minutos.
          examples:
          - https://stagropartners.blob.core.windows.net/reportes/RV-2025-0146-F02.webp?sv=...
        miniaturaUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Versión reducida para la grilla. Null si aún no se generó; la App cae a `url`.
        pie:
          type:
          - string
          - 'null'
          description: Texto que el visor muestra como encabezado de la foto.
          examples:
          - Borde norte · presencia de chinche marrón
        tomadaEn:
          type:
          - string
          - 'null'
          format: date-time
          description: Instante de captura según el dispositivo del técnico. Puede diferir de `fecha`.
        expiraEn:
          type: string
          format: date-time
          description: Caducidad de la firma SAS de `url` y `miniaturaUrl`. Vencida, la App vuelve a pedir
            el informe.
    ZonaComercial:
      type: string
      enum:
      - norte
      - chiquitania
      - sur
      description: |-
        Delimitación comercial de Agropartners. Son tres:

        | Código | Se muestra |
        |---|---|
        | `norte` | Zona Norte |
        | `chiquitania` | Chiquitania |
        | `sur` | Zona Sur |

        No viene de SAP. Ninguna operación de este contrato lo asigna ni lo modifica.
    Porcentaje:
      type: string
      description: Porcentaje ya formateado, con el signo `%` incluido. Las palabras que lo acompañan
        en pantalla son texto de la interfaz.
      examples:
      - 58%
    SocioDelContacto:
      type: object
      required:
      - cardCode
      - razonSocial
      description: 'Un socio del grupo: inicial, razón social y cantidad de propiedades.'
      properties:
        cardCode:
          $ref: '#/components/schemas/CardCode'
        razonSocial:
          type: string
          examples:
          - Sebastian Monasterio
        iniciales:
          type: string
          maxLength: 2
          examples:
          - SM
        cantidadPropiedades:
          type: integer
          minimum: 0
          description: Conteo de elementos.
    GrupoEconomico:
      type: object
      required:
      - id
      - nombre
      - socios
      description: El conjunto de socios que Agropartners atiende como una sola relación comercial. Es
        el «Todos» del selector; omitir `cardCode` equivale a consultarlos todos.
      properties:
        id:
          type: string
          examples:
          - GRP-014
        nombre:
          type: string
          examples:
          - Grupo Monasterio
        socios:
          type: array
          description: Los socios que la persona alcanza, y la lista «Socios de negocio del grupo» de
            *Mi perfil*.
          items:
            $ref: '#/components/schemas/SocioDelContacto'
    EnlaceInformeDeCampo:
      type: object
      required:
      - url
      - formato
      - tamanoBytes
      - expiraEn
      description: Enlace al PDF del informe de visita, con su tipo, su peso y la caducidad de la firma.
      properties:
        url:
          type: string
          format: uri
        formato:
          type: string
          examples:
          - application/pdf
          description: Tipo MIME del archivo.
        tamanoBytes:
          type: integer
          description: Peso del archivo en bytes.
        expiraEn:
          type: string
          format: date-time
          description: Caducidad de la firma SAS.
    AcuseSolicitudDeVisita:
      type: object
      required:
      - solicitudId
      - mensaje
      - creadoEn
      description: Confirma que la solicitud quedó registrada. No hay estados posteriores que consultar.
      properties:
        solicitudId:
          type: string
          format: uuid
          description: Identifica esta solicitud en la traza del servicio.
        mensaje:
          type: string
          description: Qué mostrarle al socio. La App lo pinta en el toast tal cual.
        creadoEn:
          type: string
          format: date-time
    AcuseEmisionEstadoDeCuenta:
      type: object
      required:
      - solicitudId
      - estado
      - creadoEn
      description: Acuse de una emisión de estado de cuenta. El avance se sigue con `GET /estados-de-cuenta`.
      properties:
        solicitudId:
          type: string
          format: uuid
        estado:
          type: string
          enum:
          - pendiente
          - generando
          - disponible
          - fallida
          description: Avance de la emisión. `pendiente` al recibirse.
        mensaje:
          type: string
          description: Qué mostrarle al socio. La App lo pinta en el toast tal cual.
        reintentarEnSegundos:
          type: integer
          examples:
          - 5
          description: Cuánto esperar antes de volver a consultar `GET /estados-de-cuenta`.
        creadoEn:
          type: string
          format: date-time
