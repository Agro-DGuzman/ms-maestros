paths:
  /version:
    x-agropartners-servicio: maestros
    get:
      tags:
      - Operación de la App
      summary: Consultar el estado de la versión instalada
      description: |-
        La App lo invoca **al arrancar, antes del login**, y el servidor responde qué hacer con la
        versión instalada: dejarla pasar, sugerir actualización o exigirla.

        Existe porque publicar una corrección no obliga a nadie a instalarla. Sin este endpoint, una
        versión con un cálculo de saldos equivocado sigue en circulación durante semanas.

        ### Por qué es público
        Si una versión antigua quedó incompatible con el ingreso, exigirle autenticarse para enterarse de
        que debe actualizar la dejaría atrapada. No recibe identidad y responde lo mismo a cualquiera que
        pregunte por la misma versión y plataforma.

        ### Cómo debe reaccionar la App
        - Decide por `permiteContinuar`, no por `estado`: el enumerado puede crecer, el booleano no.
        - `permiteContinuar: true` sin `titulo` → continúa en silencio.
        - `permiteContinuar: true` con `titulo` → aviso descartable, y deja entrar.
        - `permiteContinuar: false` → pantalla bloqueante con botón a `urlTienda`, sin opción de omitir.
        - **Si la llamada falla o no hay red, la App continúa.** Un control de versión que bloquea cuando
          el backend no responde convierte una caída del servidor en una App inutilizable.

        `titulo` y `mensaje` llegan del servidor para poder explicar el motivo sin publicar una versión
        nueva. Los mínimos se fijan por plataforma.
      operationId: consultarVersion
      security: []
      parameters:
      - name: plataforma
        in: query
        required: true
        description: Plataforma del dispositivo. Los mínimos se fijan por separado en cada una.
        schema:
          type: string
          enum:
          - android
          - ios
      - name: version
        in: query
        required: true
        description: Versión instalada, en formato semántico `MAYOR.MENOR.PARCHE`.
        schema:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          examples:
          - 2.0.0
      responses:
        '200':
          description: Estado de la versión consultada.
          headers:
            Cache-Control:
              description: Caché breve, para que retirar una versión surta efecto en minutos.
              schema:
                type: string
                examples:
                - public, max-age=300
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - success
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/EstadoVersion'
                  success:
                    type: boolean
                    const: true
                  error:
                    type: 'null'
                    description: Siempre null cuando `success` es true.
              examples:
                vigente:
                  summary: Versión al día · deja pasar
                  value:
                    data:
                      estado: vigente
                      versionConsultada: 2.1.0
                      versionMinimaSoportada: 1.8.0
                      versionRecomendada: 2.1.0
                      permiteContinuar: true
                      titulo: null
                      mensaje: null
                      urlTienda: https://play.google.com/store/apps/details?id=bo.com.agropartners.socio
                      consultadoEn: '2026-08-19T11:38:00Z'
                    success: true
                    error: null
                actualizacionSugerida:
                  summary: Hay una versión nueva · aviso descartable
                  value:
                    data:
                      estado: actualizacion_sugerida
                      versionConsultada: 2.0.0
                      versionMinimaSoportada: 1.8.0
                      versionRecomendada: 2.1.0
                      permiteContinuar: true
                      titulo: Hay una versión nueva
                      mensaje: La versión 2.1.0 mejora la descarga de facturas. Puedes actualizar cuando
                        quieras.
                      urlTienda: https://play.google.com/store/apps/details?id=bo.com.agropartners.socio
                      consultadoEn: '2026-08-19T11:38:00Z'
                    success: true
                    error: null
                actualizacionObligatoria:
                  summary: Versión retirada · pantalla bloqueante
                  value:
                    data:
                      estado: actualizacion_obligatoria
                      versionConsultada: 1.7.2
                      versionMinimaSoportada: 1.8.0
                      versionRecomendada: 2.1.0
                      permiteContinuar: false
                      titulo: Actualización necesaria
                      mensaje: Esta versión dejó de estar disponible por una corrección en el cálculo de
                        saldos. Actualiza para seguir usando la App.
                      urlTienda: https://play.google.com/store/apps/details?id=bo.com.agropartners.socio
                      consultadoEn: '2026-08-19T11:38:00Z'
                    success: true
                    error: null
        '400':
          description: Parámetros mal formados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                parametroInvalido:
                  summary: Versión sin formato semántico
                  value:
                    data: null
                    success: false
                    error:
                      code:
                      - PARAMETRO_INVALIDO
                      description: La versión debe tener el formato MAYOR.MENOR.PARCHE.
                      structuredMessage:
                      - campo: version
                        codigo: PARAMETRO_INVALIDO
                        mensaje: Se espera un valor como 2.1.0.
                      type: VALIDATION
  /auth/otp:
    x-agropartners-servicio: maestros
    post:
      tags:
      - Autenticación
      summary: Solicitar el código de acceso por WhatsApp
      description: |-
        Primer paso del ingreso. Recibe el celular del socio, envía un código de 4 dígitos por WhatsApp y
        devuelve el `otpId` que identifica el desafío. Es público.

        El número llega sin prefijo: el servicio antepone `+591` y lo compara contra el celular registrado
        en SAP, ya normalizado. Debe ser el de un **usuario habilitado** — persona de contacto del socio,
        con acceso concedido por Agropartners.

        Un número registrado y uno que no lo está devuelven **la misma respuesta `200`, con el mismo texto
        y el mismo tiempo**. Solo en el primero sale un mensaje de WhatsApp; el error aparece recién en
        `POST /auth/login` como `CODIGO_INVALIDO`.

        ### Reglas de seguridad
        - 3 envíos por hora y por número, 10 por IP y por hora. Al superarlo, `429` con `LIMITE_TASA_SUPERADO`.
        - Antes del plazo mínimo de reenvío, `429` con `REENVIO_DEMASIADO_PRONTO`. Un envío nuevo invalida el desafío previo.
        - El código no se registra en logs, trazas ni cuerpos capturados por APIM. Se almacena su hash con la sal de la sesión.
        - Vigencia de 5 minutos y un solo uso.
        - TLS obligatorio; credenciales del proveedor de WhatsApp en Azure Key Vault.
      operationId: solicitarCodigo
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCodigo'
            examples:
              solicitar:
                summary: Celular registrado como contacto del socio
                value:
                  telefono: '70741828'
      responses:
        '200':
          description: Desafío abierto. Si el número está registrado, el código va en camino por WhatsApp.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - success
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/DesafioOtp'
                  success:
                    type: boolean
                    const: true
                  error:
                    type: 'null'
                    description: Siempre null cuando `success` es true.
              examples:
                enviado:
                  value:
                    data:
                      otpId: e2b5a4d1-0c67-4f3a-9b18-5d2c7e91f306
                    success: true
                    error: null
        '400':
          description: Parámetros mal formados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                parametroInvalido:
                  summary: El cuerpo no trae un celular
                  value:
                    data: null
                    success: false
                    error:
                      code:
                      - PARAMETRO_INVALIDO
                      description: Falta indicar el celular.
                      structuredMessage:
                      - campo: telefono
                        codigo: PARAMETRO_INVALIDO
                        mensaje: Requerido.
                      type: VALIDATION
        '429':
          description: Demasiadas solicitudes de código.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                reenvioPronto:
                  summary: «Reenviar código» antes del plazo
                  value:
                    data: null
                    success: false
                    error:
                      code:
                      - REENVIO_DEMASIADO_PRONTO
                      description: Espera unos segundos antes de pedir otro código.
                      structuredMessage: []
                      type: FAILURE
                limite:
                  summary: Tope de envíos por número o por IP
                  value:
                    data: null
                    success: false
                    error:
                      code:
                      - LIMITE_TASA_SUPERADO
                      description: Demasiados intentos. Vuelve a intentarlo más tarde.
                      structuredMessage: []
                      type: FAILURE
        '503':
          description: El canal de WhatsApp no está disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                canalCaido:
                  value:
                    data: null
                    success: false
                    error:
                      code:
                      - CANAL_NO_DISPONIBLE
                      description: No pudimos enviar el código en este momento. Intenta de nuevo en unos
                        minutos.
                      structuredMessage: []
                      type: FAILURE
  /auth/login:
    x-agropartners-servicio: maestros
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión con el código recibido por WhatsApp
      description: |-
        Segundo paso del ingreso. Verifica el código contra el desafío abierto en `POST /auth/otp` y abre
        la sesión de aplicación. Es público.

        El backend canjea la identidad contra Microsoft Entra External ID mediante una *custom
        authentication extension*, actuando como cliente confidencial. Devuelve los tokens con el contexto
        de negocio, de modo que la App pinta la pantalla de Inicio sin llamadas adicionales.

        Registra el dispositivo para notificaciones push si se envía el bloque `dispositivo`. **Es el único
        punto de registro del token push**: si la plataforma lo rota, hay que volver a iniciar sesión.

        Código incorrecto, código de otro desafío y número no habilitado devuelven `CODIGO_INVALIDO`, con el
        mismo texto y el mismo tiempo de respuesta. `DESAFIO_EXPIRADO` e `INTENTOS_AGOTADOS` sí se
        distinguen: la App debe volver a la pantalla del teléfono.

        ### Reglas de seguridad
        - El código no se registra, y debe excluirse de los cuerpos que APIM diagnostica.
        - Un solo uso: reenviar el mismo `otpId` con el mismo código responde `CODIGO_INVALIDO`.
        - 5 códigos incorrectos invalidan el desafío (`INTENTOS_AGOTADOS`).
        - 10 verificaciones por minuto y por IP; `429` al superarlo.
        - TLS obligatorio; `client_secret` en Azure Key Vault.
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodigoDeAcceso'
            examples:
              conDispositivo:
                summary: Ingreso desde Android con notificaciones
                value:
                  otpId: e2b5a4d1-0c67-4f3a-9b18-5d2c7e91f306
                  codigo: '0421'
                  dispositivo:
                    instalacionId: 3f1c9a20-8d44-4b6e-9d21-6a7f0c4b18ee
                    plataforma: android
              sinDispositivo:
                summary: Ingreso sin habilitar notificaciones
                value:
                  otpId: e2b5a4d1-0c67-4f3a-9b18-5d2c7e91f306
                  codigo: '0421'
      responses:
        '200':
          description: Código correcto. Sesión abierta.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - success
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/SesionAplicacion'
                  success:
                    type: boolean
                    const: true
                  error:
                    type: 'null'
                    description: Siempre null cuando `success` es true.
              examples:
                ingresoCorrecto:
                  value:
                    data:
                      sesionId: b41d7e02-9c33-4f18-8a6d-70c2f5e91a44
                      tokens:
                        accessToken: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJvaWQiOiI4ZjJiMWM0MC01YTdlIn0.REDACTADO
                        tokenType: Bearer
                        expiraEnSegundos: 3600
                        refreshToken: 0.AXoAj7IcQH5aEUqdPiyKaw8dVQ...REDACTADO
                      contexto:
                        nombre: Mónica Salvatierra
                        iniciales: MS
                        celular: +591 707 41 828
                        grupoEconomico:
                          id: GRP-014
                          nombre: Grupo Monasterio
                          socios:
                          - cardCode: C-004871
                            razonSocial: Sebastian Monasterio
                            iniciales: SM
                            cantidadPropiedades: 2
                          - cardCode: C-004872
                            razonSocial: Fernando Monasterio
                            iniciales: FM
                            cantidadPropiedades: 3
                          - cardCode: C-004873
                            razonSocial: Osvaldo Monasterio
                            iniciales: OM
                            cantidadPropiedades: 1
                      iniciadaEn: '2026-08-19T11:40:00Z'
                      expiraEn: '2026-08-19T12:40:00Z'
                      dispositivoRegistrado: true
                    success: true
                    error: null
        '400':
          description: Parámetros mal formados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                parametroInvalido:
                  summary: Código con longitud incorrecta
                  value:
                    data: null
                    success: false
                    error:
                      code:
                      - PARAMETRO_INVALIDO
                      description: El código debe tener exactamente 4 dígitos.
                      structuredMessage:
                      - campo: codigo
                        codigo: PARAMETRO_INVALIDO
                        mensaje: Se esperan 4 dígitos, sin espacios ni separadores.
                      type: VALIDATION
        '401':
          description: Código inválido, desafío vencido o intentos agotados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                codigoInvalido:
                  summary: Código incorrecto o número no registrado
                  value:
                    data: null
                    success: false
                    error:
                      code:
                      - CODIGO_INVALIDO
                      description: El código no es correcto. Revisa el mensaje de WhatsApp.
                      structuredMessage: []
                      type: FAILURE
                desafioExpirado:
                  summary: Pasaron más de 5 minutos
                  value:
                    data: null
                    success: false
                    error:
                      code:
                      - DESAFIO_EXPIRADO
                      description: El código venció. Pide uno nuevo.
                      structuredMessage: []
                      type: FAILURE
                intentosAgotados:
                  summary: Cinco códigos incorrectos seguidos
                  value:
                    data: null
                    success: false
                    error:
                      code:
                      - INTENTOS_AGOTADOS
                      description: Demasiados intentos con este código. Pide uno nuevo.
                      structuredMessage: []
                      type: FAILURE
        '429':
          description: Demasiados intentos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                limite:
                  value:
                    data: null
                    success: false
                    error:
                      code:
                      - LIMITE_TASA_SUPERADO
                      description: Demasiados intentos de verificación. Espera un minuto.
                      structuredMessage: []
                      type: FAILURE
  /auth/refresh:
    x-agropartners-servicio: maestros
    post:
      tags:
      - Autenticación
      summary: Renovar el token de acceso
      description: |-
        Canjea el `refreshToken` por un token de acceso nuevo, sin volver a pedir el código por WhatsApp.
        Es público: el propio refresh token es la credencial.

        Sostiene la pantalla de desbloqueo biométrico: la biometría abre el almacenamiento seguro del
        dispositivo, y el servidor solo ve esta renovación.

        Cada renovación **rota el refresh token**. Si uno ya usado se presenta otra vez, se revoca toda la
        cadena y la sesión se cierra.
      operationId: renovarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenovacionSesion'
            examples:
              renovar:
                value:
                  refreshToken: 0.AXoAj7IcQH5aEUqdPiyKaw8dVQ...REDACTADO
      responses:
        '200':
          description: Token renovado.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - success
                - error
                properties:
                  data:
                    $ref: '#/components/schemas/TokensAcceso'
                  success:
                    type: boolean
                    const: true
                  error:
                    type: 'null'
                    description: Siempre null cuando `success` es true.
              examples:
                renovado:
                  value:
                    data:
                      accessToken: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJvaWQiOiI4ZjJiMWM0MC01YTdlIn0.REDACTADO
                      tokenType: Bearer
                      expiraEnSegundos: 3600
                      refreshToken: 0.AXoAj7IcQH5aEUqdPiyKaw8dVQ...REDACTADO
                    success: true
                    error: null
        '401':
          description: Refresh token inválido, expirado o ya utilizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                invalido:
                  value:
                    data: null
                    success: false
                    error:
                      code:
                      - REFRESH_TOKEN_INVALIDO
                      description: La sesión expiró. Vuelve a iniciar sesión con tu celular.
                      structuredMessage: []
                      type: FAILURE
  /auth/logout:
    x-agropartners-servicio: maestros
    post:
      tags:
      - Autenticación
      summary: Cerrar la sesión de aplicación
      description: |-
        Cierra la sesión **de este dispositivo**: revoca el refresh token, desregistra el dispositivo de
        notificaciones y cierra la traza de auditoría. Otras sesiones del mismo socio no se ven afectadas.

        La App debe además descartar sus tokens del almacenamiento seguro: este endpoint no invalida un
        access token ya emitido, que es un JWT válido hasta expirar. Descartar el refresh token apaga
        también el desbloqueo biométrico.

        Es idempotente: cerrar una sesión ya cerrada devuelve `200`.
      operationId: cerrarSesion
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CierreSesion'
            examples:
              cerrarSesion:
                value:
                  refreshToken: 0.AXoAj7IcQH5aEUqdPiyKaw8dVQ...REDACTADO
                  instalacionId: 3f1c9a20-8d44-4b6e-9d21-6a7f0c4b18ee
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - success
                - error
                properties:
                  data:
