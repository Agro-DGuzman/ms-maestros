# Apunta `app`, `worker` y `keycloak` a bases en Azure SQL.
#
# Cada uno con sus credenciales y su archivo. Compose lee los dos y no hace
# falta exportar nada al shell, asi que el comando es el mismo en PowerShell y
# en bash:
#
#   docker compose --env-file .env.azure --env-file .env.keycloak.azure \
#     -f compose.yaml -f compose.azure.yaml up -d app worker keycloak
#
#   .env.azure           la base de maestros, con su usuario
#   .env.keycloak.azure  la base de Keycloak, con el suyo
#
# Estan separados porque son credenciales distintas de verdad: el usuario de
# Keycloak no necesita ver la replica de SAP, ni el de maestros el esquema de
# Keycloak. Los dos los ignora git por la regla `.env.*`.
#
# `APP_ENV` baja a `local` a propósito. Con `production`, dos resguardos del
# back-office fallan al primer pedido y hacen bien: `AutenticadorDeDesarrollo`
# se niega a existir, y `RestringirPorIp` exige rangos configurados. Esto no es
# producción, así que no hay nada que relajar.
services:
  app:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlsrv
      DB_HOST: "${DB_HOST:?falta DB_HOST}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_DATABASE: "${DB_DATABASE:?falta DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME:?falta DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD:?falta DB_PASSWORD}"
      # Azure SQL presenta un certificado válido: se cifra sin confiar a ciegas.
      DB_ENCRYPT: "yes"
      DB_TRUST_SERVER_CERTIFICATE: "false"

  worker:
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: sqlsrv
      DB_HOST: "${DB_HOST:?falta DB_HOST}"
      DB_PORT: "${DB_PORT:-1433}"
      DB_DATABASE: "${DB_DATABASE:?falta DB_DATABASE}"
      DB_USERNAME: "${DB_USERNAME:?falta DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD:?falta DB_PASSWORD}"
      DB_ENCRYPT: "yes"
      DB_TRUST_SERVER_CERTIFICATE: "false"

  # El Keycloak de verdad: la imagen propia, contra su propia base en el mismo
  # servidor de Azure. Reemplaza al `start-dev` con base embebida de
  # `compose.yaml`, que pierde todo al recrear el contenedor.
  #
  # Es el ensayo de lo que va a Container Apps: misma imagen, misma base, mismo
  # emisor. Lo unico que cambia alla es de donde sale cada credencial.
  keycloak:
    build:
      context: ./docker/keycloak
      dockerfile: Dockerfile
    image: ms-maestros-keycloak:local
    command: []
    environment:
      # Credenciales propias, no las de maestros. Keycloak es dueño de su base
      # y no tiene por qué poder leer la réplica de SAP: si algún día su usuario
      # se filtra, lo que alcanza es su propio esquema.
      KC_DB_URL: "jdbc:sqlserver://${AZ_KC_HOST:?falta AZ_KC_HOST}:${AZ_KC_PORT:-1433};databaseName=${AZ_KC_DATABASE:?falta AZ_KC_DATABASE};encrypt=true;trustServerCertificate=false;loginTimeout=30"
      KC_DB_USERNAME: "${AZ_KC_USERNAME:?falta AZ_KC_USERNAME}"
      KC_DB_PASSWORD: "${AZ_KC_PASSWORD:?falta AZ_KC_PASSWORD}"

      # El `iss` de todos los tokens. Es el mismo valor en local y en la nube a
      # proposito: si difiriera, un token emitido en el ensayo no serviria alla
      # y estariamos probando otra cosa.
      KC_HOSTNAME: "${AZ_KC_ISSUER:-https://identidad.agropartners.com.bo}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

      KC_BOOTSTRAP_ADMIN_USERNAME: "${AZ_KC_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${AZ_KC_ADMIN_PASSWORD:?falta AZ_KC_ADMIN_PASSWORD}"

      # Lo sustituye el import dentro del realm. Tiene que ser identico al
      # KEYCLOAK_CLIENT_SECRET de `app` y `worker`.
      MS_MAESTROS_CLIENT_SECRET: "${AZ_KC_CLIENT_SECRET:?falta AZ_KC_CLIENT_SECRET}"

    # `!reset` y no `[]`: una lista vacia en un override NO borra la del archivo
    # base, la deja intacta. Sin esto seguiria montado `docker/keycloak/`, que
    # tapa con el realm de desarrollo el de produccion que va dentro de la
    # imagen — e importaria `secreto-de-desarrollo` contra la base de Azure.
    volumes: !reset []
