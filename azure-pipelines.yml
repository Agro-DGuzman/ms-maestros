# Construye y despliega ms-maestros en Azure Container Apps.
#
# Tres etapas, y la primera existe para que las otras dos no corran sobre algo
# roto: si las compuertas fallan, no se publica nada.
#
# Despliega la aplicación y el worker, siempre con la misma imagen: si no, los
# dos corren código distinto sobre la misma cola. Keycloak no pasa por acá; su
# imagen cambia rara vez y se publica aparte (ver infra/README.md).

trigger:
  branches:
    include:
      - main

variables:
  conexionAzure: 'sc-agropartners-azure'
  conexionDelRegistro: 'sc-agropartners-acr'
  servidorDelRegistro: 'acragropartnerseus2.azurecr.io'
  grupoDeRecursos: 'rg-agropartners-int-eus2'
  appDeContenedor: 'ms-maestros'
  workerDeContenedor: 'worker'

  repositorioDeImagen: 'ms-maestros'
  # La etiqueta es el commit: mirando un contenedor se sabe exactamente qué
  # código está corriendo, y se puede volver a esa versión. Con `latest` no.
  etiqueta: '$(Build.SourceVersion)'

stages:
  - stage: Verificar
    displayName: Compuertas
    jobs:
      - job: compuertas
        displayName: tests, análisis estático y estilo
        pool:
          vmImage: ubuntu-latest
        steps:
          # El agente trae PHP 8.3 y el proyecto pide 8.4. Tampoco sirve un job
          # con `container:`: DevOps corre esos pasos con un usuario sin root, y
          # la imagen oficial de PHP no trae sudo, así que apt-get no instala
          # nada. Un contenedor lanzado a mano corre como root.
          - script: |
              set -e
              docker run -d --name php -v "$(Build.SourcesDirectory)":/app -w /app php:8.4-cli sleep infinity
              docker exec php bash -ec '
                apt-get update -qq
                apt-get install -y -qq git unzip libzip-dev > /dev/null
                docker-php-ext-install zip > /dev/null
                curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
              '
            displayName: preparar PHP 8.4 y composer

          - script: docker exec php composer install --no-interaction --prefer-dist --no-progress
            displayName: dependencias

          # La aplicación necesita una clave para arrancar, incluso en pruebas.
          # Esta es descartable y solo vive en el agente.
          - script: |
              set -e
              docker exec php cp .env.example .env
              docker exec php php artisan key:generate
            displayName: entorno de prueba

          - script: docker exec php composer test
            displayName: pruebas

          - script: docker exec php composer stan
            displayName: análisis estático

          - script: docker exec php composer lint -- --test
            displayName: estilo

          # `test:integration` NO corre acá: necesita un Keycloak vivo con el
          # realm de desarrollo. Se corre a mano, y está documentado por qué en
          # CLAUDE.md.

  - stage: Publicar
    displayName: Construir y publicar la imagen
    dependsOn: Verificar
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: imagen
        displayName: construir y subir al registro
        pool:
          vmImage: ubuntu-latest
        steps:
          # Por la conexión del registro y no con `az acr build`: esta es la que
          # ya publicaba en este registro. La conexión de Azure no se sabe si
          # tiene permiso de escritura sobre él, y si no lo tiene el error
          # aparece recién acá, después de pasar las compuertas.
          - task: Docker@2
            displayName: construir y publicar
            inputs:
              command: buildAndPush
              containerRegistry: $(conexionDelRegistro)
              repository: $(repositorioDeImagen)
              Dockerfile: docker/Dockerfile
              buildContext: .
              tags: |
                $(etiqueta)

  - stage: Desplegar
    displayName: Desplegar en Container Apps
    dependsOn: Publicar
    condition: succeeded()
    jobs:
      - deployment: desplegar
        displayName: actualizar la revisión
        pool:
          vmImage: ubuntu-latest
        environment: integracion
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: apuntar a la imagen nueva
                  inputs:
                    azureSubscription: $(conexionAzure)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      az extension add --name containerapp --upgrade --only-show-errors

                      # Solo cambia la imagen. Las variables de entorno y los
                      # secretos son configuración del Container App y se tocan
                      # aparte: un pipeline que los reescriba en cada despliegue
                      # los puede borrar sin que nadie lo note.
                      az containerapp update \
                        --name $(appDeContenedor) \
                        --resource-group $(grupoDeRecursos) \
                        --image $(servidorDelRegistro)/$(repositorioDeImagen):$(etiqueta)

                      # Mismo paso y misma etiqueta que la app: un despliegue
                      # que actualizara solo uno de los dos saldría en verde con
                      # la cola partida entre dos versiones.
                      az containerapp update \
                        --name $(workerDeContenedor) \
                        --resource-group $(grupoDeRecursos) \
                        --image $(servidorDelRegistro)/$(repositorioDeImagen):$(etiqueta)

                      # Que la plantilla diga la imagen nueva no alcanza: si la
                      # revisión no arranca, el worker viejo sigue atendiendo y
                      # nadie se entera. Se exige que la revisión lista sea la
                      # última.
                      for intento in $(seq 1 12); do
                        ultima=$(az containerapp show --name $(workerDeContenedor) \
                          --resource-group $(grupoDeRecursos) \
                          --query properties.latestRevisionName -o tsv)
                        lista=$(az containerapp show --name $(workerDeContenedor) \
                          --resource-group $(grupoDeRecursos) \
                          --query properties.latestReadyRevisionName -o tsv)
                        if [ "$ultima" = "$lista" ]; then
                          echo "worker en la revisión $lista"
                          break
                        fi
                        if [ "$intento" = "12" ]; then
                          echo "la revisión $ultima del worker no quedó lista en 2 minutos"
                          exit 1
                        fi
                        echo "intento $intento: lista $lista, esperando $ultima"
                        sleep 10
                      done

                # Las migraciones van después de que la revisión esté arriba, y
                # a mano por ahora: correrlas dentro del arranque del contenedor
                # es una carrera apenas hay más de una réplica.
                - task: AzureCLI@2
                  displayName: comprobar que responde
                  inputs:
                    azureSubscription: $(conexionAzure)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      fqdn=$(az containerapp show \
                        --name $(appDeContenedor) \
                        --resource-group $(grupoDeRecursos) \
                        --query properties.configuration.ingress.fqdn -o tsv)

                      for intento in $(seq 1 12); do
                        codigo=$(curl -s -o /dev/null -w '%{http_code}' "https://$fqdn/up" || true)
                        if [ "$codigo" = "200" ]; then
                          echo "responde en https://$fqdn"
                          exit 0
                        fi
                        echo "intento $intento: http $codigo"
                        sleep 10
                      done

                      echo "la revisión nueva no respondió en 2 minutos"
                      exit 1
