# El entorno lo comparten app y worker: el worker resuelve el desafio contra la
# misma base y el mismo Keycloak, asi que cualquier diferencia entre los dos
# seria un bug silencioso.
x-entorno-comun: &entorno-comun
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "${APP_KEY:?APP_KEY es obligatorio: copialo de tu .env}"
  LOG_CHANNEL: stderr
  CACHE_STORE: file
  SESSION_DRIVER: file
  # NO poner sync: con sync el envio del desafio vuelve a correr dentro de la
  # peticion y reaparece la fuga de tiempo de POST /auth/otp, que responde lo
  # mismo y en el mismo tiempo exista o no el numero.
  QUEUE_CONNECTION: database
  DB_CONNECTION: sqlsrv
  DB_HOST: sqlserver
  DB_PORT: "1433"
  DB_DATABASE: maestros
  DB_USERNAME: sa
  DB_PASSWORD: "Agro.Local.2026"
  # El SQL Server local se firma solo; Azure SQL no necesita esto.
  DB_TRUST_SERVER_CERTIFICATE: "true"
  # Dentro de la red de compose Keycloak siempre escucha en 8080,
  # sin importar en que puerto del host lo hayas publicado.
  KEYCLOAK_BASE_URL: http://keycloak:8080
  KEYCLOAK_REALM: agropartners
  KEYCLOAK_CLIENT_ID: ms-maestros
  KEYCLOAK_CLIENT_SECRET: secreto-de-desarrollo
  WHATSAPP_DRIVER: log

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # La imagen sirve en 8080. Sin volumen montado: montar el proyecto encima
    # taparia el vendor optimizado que se construyo dentro de la imagen.
    ports: ["${APP_PORT:-8000}:8080"]
    environment: *entorno-comun
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  # Sin esto los desafios se encolan y no se envian nunca: el trabajo que
  # resuelve la persona y habla con WhatsApp corre aca.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    environment: *entorno-comun
    # El healthcheck de la imagen hace curl a /up, que solo tiene sentido para
    # el que sirve HTTP. El worker no escucha en ningun puerto, asi que
    # heredarlo lo deja permanentemente unhealthy.
    healthcheck:
      disable: true
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Agro.Local.2026"
    ports: ["1433:1433"]
    # El login de 'sa' no esta listo apenas arranca el contenedor: sin esto,
    # app y worker arrancan antes y llenan el log de "Login failed for user sa"
    # hasta que el motor termina de inicializar.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # El contenedor de SQL Server arranca sin la base que DB_DATABASE nombra, asi
  # que sin este paso `migrate` falla en un stack recien levantado. En Azure SQL
  # la base la crea la plataforma y este servicio no corre.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: "Agro.Local.2026"
    command:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF DB_ID('maestros') IS NULL CREATE DATABASE maestros;"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes: ["./docker/keycloak:/opt/keycloak/data/import"]
    ports: ["${KEYCLOAK_PORT:-8080}:8080"]
