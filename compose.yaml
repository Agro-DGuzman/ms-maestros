services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # La imagen sirve en 8080. Sin volumen montado: montar el proyecto encima
    # taparia el vendor optimizado que se construyo dentro de la imagen.
    ports: ["${APP_PORT:-8000}:8080"]
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?APP_KEY es obligatorio: copialo de tu .env}"
      LOG_CHANNEL: stderr
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: sqlsrv
      DB_HOST: sqlserver
      DB_PORT: "1433"
      DB_DATABASE: maestros
      DB_USERNAME: sa
      DB_PASSWORD: "Agro.Local.2026"
      # El SQL Server local se firma solo; Azure SQL no necesita esto.
      DB_TRUST_SERVER_CERTIFICATE: "true"
      # Dentro de la red de compose Keycloak siempre escucha en 8080,
      # sin importar en que puerto del host lo hayas publicado.
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: agropartners
      KEYCLOAK_CLIENT_ID: ms-maestros
      KEYCLOAK_CLIENT_SECRET: secreto-de-desarrollo
      WHATSAPP_DRIVER: log
    depends_on: [sqlserver, keycloak]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Agro.Local.2026"
    ports: ["1433:1433"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes: ["./docker/keycloak:/opt/keycloak/data/import"]
    ports: ["${KEYCLOAK_PORT:-8080}:8080"]
